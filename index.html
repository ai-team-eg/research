<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الذكاء الاصطناعي - الصف الثاني بكالوريا</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060913;
            --card-bg: rgba(17, 25, 48, 0.65);
            --card-border: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الشبكة العصبية المتحركة */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12), transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(129, 140, 248, 0.15), transparent 45%),
                        #060913;
        }

        /* شريط التنقل العائم */
        nav {
            position: sticky;
            top: 15px;
            z-index: 1000;
            max-width: 960px;
            margin: 15px auto 0;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #060913;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        /* الهيدر الرئيسي */
        header {
            text-align: center;
            padding: 70px 20px 50px;
            max-width: 900px;
            margin: 0 auto;
        }

        .badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: pulseGlow 3s infinite;
        }

        header h1 {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-weight: 900;
            background: linear-gradient(to left, #ffffff, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            min-height: 85px;
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            max-width: 700px;
            margin: 0 auto;
        }

        /* الحاوية والبطاقات الزجاجية */
        .container {
            max-width: 1050px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease, border-color 0.3s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.6);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 28px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-radius: 5px;
        }

        .highlight-box {
            background: rgba(56, 189, 248, 0.08);
            border-right: 4px solid var(--primary);
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 1.05rem;
        }

        .highlight-box strong {
            color: var(--primary);
        }

        /* شبكة بطاقات فريق العمل ثلاثية الأبعاد */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .box {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .box:hover {
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2);
        }

        .student-num {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 12px;
            font-weight: 800;
            color: var(--secondary);
            background: rgba(129, 140, 248, 0.15);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .box h3 {
            color: #fff;
            font-size: 1.2rem;
            margin: 15px 0 10px;
            font-weight: 700;
        }

        .box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #060913;
            font-weight: 800;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
        }

        /* قائمة المراجع */
        ul.refs {
            list-style: none;
            margin-top: 15px;
        }

        ul.refs li {
            position: relative;
            padding-right: 28px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        ul.refs li::before {
            content: '✦';
            position: absolute;
            right: 0;
            color: var(--primary);
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-size: 0.95rem;
            background: rgba(6, 9, 19, 0.8);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
            50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
        }

        @media (max-width: 600px) {
            nav { border-radius: 20px; margin: 10px; }
            .card { padding: 22px 18px; }
            header { padding: 45px 15px 30px; }
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<nav>
    <a href="index.html" class="active">الرئيسية</a>
    <a href="student1.html">الطالب 1</a>
    <a href="student2.html">الطالب 2</a>
    <a href="student3.html">الطالب 3</a>
    <a href="student4.html">الطالب 4</a>
    <a href="student5.html">الطالب 5</a>
</nav>

<header>
    <div class="badge">✨ مشروع البرمجة والذكاء الاصطناعي • البكالوريا المصرية</div>
    <h1 id="typing-title"></h1>
    <p>دراسة بحثية متكاملة حول مستقبل التعليم الرقمي، الفرص التكنولوجية، وضوابط الاستخدام الآمن للذكاء الاصطناعي التوليدي</p>
</header>

<div class="container">
    <div class="card reveal">
        <h2>مقدمة المشروع والسؤال الرئيسي</h2>
        <div class="highlight-box">
